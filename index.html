<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡 · 50 天对赌计划</title>

  <!-- PWA：添加到主屏幕（根路径 = 每日打卡；健身计划在 /100） -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每日打卡">

  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-row">
        <h1>📅 每日打卡</h1>
        <div class="header-actions">
          <button id="btn-today" class="btn btn-today">今天</button>
          <button id="btn-settings" class="btn btn-icon" aria-label="设置">⚙</button>
        </div>
      </div>
      <p class="subtitle">50 天 · 健身 / 学习二选一 · 10,000 元对赌 · 每天返 200</p>
    </header>

    <section id="stats" class="stats"></section>

    <section class="calendar-section">
      <div class="calendar-toolbar">
        <button id="prev-month" class="btn btn-ghost" aria-label="上个月">‹</button>
        <h2 id="month-label"></h2>
        <button id="next-month" class="btn btn-ghost" aria-label="下个月">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div id="calendar" class="calendar-grid"></div>
      <div class="legend">
        <span><i class="dot done"></i>已打卡</span>
        <span><i class="dot pending"></i>待打卡</span>
        <span><i class="dot missed"></i>已错过</span>
        <span><i class="dot future"></i>未到</span>
        <span><i class="dot rest"></i>计划外</span>
      </div>
    </section>

  </div>

  <!-- 打卡弹窗：健身 / 学习二选一 -->
  <div id="modal-checkin" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h3 id="checkin-title"></h3>
          <p id="checkin-sub" class="muted small"></p>
        </div>
        <button class="btn btn-ghost close-modal" data-modal="modal-checkin" aria-label="关闭">✕</button>
      </div>
      <div id="checkin-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3>设置</h3>
        <button class="btn btn-ghost close-modal" data-modal="modal-settings" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>计划开始日期（第 1 个打卡日）</span>
          <input type="date" id="setting-start-date">
        </label>
        <p class="muted small">修改开始日期会重新计算打卡计划，已记录的打卡按日期保留。</p>
        <div class="settings-group">
          <h4 class="settings-group-title">数据管理</h4>
          <div class="data-actions">
            <button id="btn-export" class="btn">导出备份</button>
            <button id="btn-import" class="btn">导入备份</button>
            <input type="file" id="import-file" accept="application/json" hidden>
          </div>
          <p class="muted small">数据保存在本机浏览器（localStorage），与健身计划互不影响；换浏览器/清缓存会丢失，记得定期「导出备份」。</p>
        </div>
        <div class="field">
          <button id="btn-test-celebration" class="btn">🎉 测试打卡庆祝动画</button>
          <span class="muted small">点一下立即播放动画，用于确认动画在你的浏览器里能正常显示。</span>
        </div>
        <div class="field">
          <button id="btn-check-update" class="btn">🔄 检查更新</button>
          <span class="muted small">从服务器拉取最新前端代码并刷新页面（仅清除浏览器缓存的网页文件，打卡数据不受影响）。</span>
        </div>
        <div class="danger-zone">
          <button id="btn-reset-all" class="btn btn-danger">清空所有数据</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 打卡成功庆祝动画 -->
  <div id="celebration" class="celebration hidden">
    <div id="confetti-layer" class="confetti-layer"></div>
    <div class="celebration-card">
      <div class="celebrate-emoji">🎉</div>
      <h2>今日打卡成功！</h2>
      <div class="celebrate-money">+ ¥200</div>
      <p class="celebrate-note">赶紧找对方把 <strong>200 块钱</strong> 要回来！💸</p>
      <div id="celebrate-stats"></div>
      <button id="celebration-close" class="btn btn-primary">已收款，继续加油 💪</button>
    </div>
  </div>

  <script src="js/daily-logic.js?v=16"></script>
  <script src="js/daily-store.js?v=16"></script>
  <script src="js/daily-ui.js?v=16"></script>
  <script src="js/daily-app.js?v=16"></script>
  <script>
    // PWA：http/https 下注册 Service Worker（离线可用）；file:// 打开时自动跳过
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[Daily] SW 注册失败', e)));
    }
  </script>
</body>
</html>
